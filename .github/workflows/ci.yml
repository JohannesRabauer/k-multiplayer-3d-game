name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check dependency vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Validate source
        run: npm run validate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile browser smoke test
        run: npm run test:smoke

      - name: Build server container
        run:
          docker build --file apps/server/Dockerfile --tag
          scooter-shooter-server:${{ github.sha }} .

      - name: Upload client build
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: apps/client/dist
          if-no-files-found: error
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
