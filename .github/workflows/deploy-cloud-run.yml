name: Deploy server to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloud-run.yml"
      - "apps/server/**"
      - "packages/protocol/**"
      - "package-lock.json"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.service.outputs.url }}
    env:
      IMAGE:
        ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{
        vars.GCP_ARTIFACT_REPOSITORY }}/server:${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry
        run:
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev"
          --quiet

      - name: Build and push immutable image
        run: |
          docker build \
            --file apps/server/Dockerfile \
            --tag "$IMAGE" \
            --build-arg "BUILD_SHA=${GITHUB_SHA}" \
            .
          docker push "$IMAGE"

      - name: Deploy Cloud Run revision
        id: deploy
        run: |
          gcloud run deploy "${{ vars.GCP_CLOUD_RUN_SERVICE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --image="$IMAGE" \
            --service-account="scooter-shooter-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --execution-environment=gen2 \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=80 \
            --timeout=3600 \
            --min-instances=0 \
            --max-instances=1 \
            --set-env-vars="BUILD_SHA=${GITHUB_SHA},ALLOWED_ORIGIN=https://johannesrabauer.github.io" \
            --quiet

      - name: Resolve service URL
        id: service
        shell: bash
        run: |
          url="$(
            gcloud run services describe "${{ vars.GCP_CLOUD_RUN_SERVICE }}" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --region="${{ vars.GCP_REGION }}" \
              --format="value(status.url)"
          )"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify deployed revision
        env:
          SERVICE_URL: ${{ steps.service.outputs.url }}
        run: |
          set -euo pipefail
          for path in healthz readyz version; do
            curl \
              --fail \
              --retry 12 \
              --retry-all-errors \
              --retry-delay 5 \
              --silent \
              --show-error \
              "${SERVICE_URL}/${path}"
          done
